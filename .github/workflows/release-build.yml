name: Release Build

# Cross-platform Tauri bundle matrix (p7-1).
#
# Triggered on a release tag (`vX.Y.Z`) or manual dispatch. Builds the
# tallytape app on macOS arm64 + macOS x64 + Windows x64 + Linux x64
# and uploads each bundle as a workflow artifact. Code-signing and the
# release pipeline itself ride on top of this in p7-2 / p7-4.
#
# To exercise without cutting a real release:
#   gh workflow run release-build.yml --ref <branch>
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

# Don't let a re-dispatch cancel a release build that's already running —
# orphaning a half-built artifact set is worse than waiting for the prior
# run to finish.
concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon — runs natively on M-series GH runners.
          - platform: macos-latest
            target: aarch64-apple-darwin
          # macOS Intel — needs the Intel runner image.
          - platform: macos-13
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + workspace target
        uses: Swatinem/rust-cache@v2
        with:
          # Scope cache by target so cross-platform jobs don't trample each other.
          key: ${{ matrix.target }}

      - uses: oven-sh/setup-bun@v2

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build Tauri bundle
        run: bun run tauri build --target ${{ matrix.target }}

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: tallytape-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*
          if-no-files-found: error
          retention-days: 14
